name: build check

on:
  push:
    branches: [claude/project-thread-9g4m9e]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: swift build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - if: always()
        shell: bash
        run: grep -E "error:|warning:.*Schedule" build.log || true
